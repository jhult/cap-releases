name: tmp-win-diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CapSoftware/Cap
          ref: cap-v0.6.3
          path: cap

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch dxc archive with node fetch
        shell: bash
        working-directory: cap
        run: |
          set -euo pipefail
          mkdir -p target
          cat > /tmp/dl.mjs <<'EOF'
          import { createHash } from "node:crypto";
          import { writeFile } from "node:fs/promises";
          const response = await fetch(process.env.URL);
          const body = Buffer.from(await response.arrayBuffer());
          await writeFile(process.env.OUT, body);
          console.log("bytes", body.length, "sha256", createHash("sha256").update(body).digest("hex"));
          EOF
          URL=https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.dxc/1.9.2607.13/microsoft.direct3d.dxc.1.9.2607.13.nupkg \
            OUT=target/dxc-node.zip node /tmp/dl.mjs

      - name: Expand-Archive through node child_process
        shell: bash
        working-directory: cap
        run: |
          set -euo pipefail
          node -v
          cat > /tmp/exec.mjs <<'EOF'
          import { exec } from "node:child_process";
          exec(
            'Expand-Archive -Path "target/dxc-node.zip" -DestinationPath "target/ex-exec-dxc" -Force',
            { shell: "powershell.exe" },
            (error, stdout, stderr) => {
              console.log("error:", error && error.message);
              console.log("stdout:", JSON.stringify(stdout));
              console.log("stderr:", JSON.stringify(stderr));
            },
          );
          EOF
          node /tmp/exec.mjs
          sleep 3
          ls -la target/ || true
          ls -la target/ex-exec-dxc 2>&1 | head -20 || true
          echo "--- direct powershell ---"
          powershell.exe -NoProfile -Command 'Expand-Archive -Path "target/dxc-node.zip" -DestinationPath "target/ex-direct-dxc" -Force; Write-Output ("errors=" + $Error.Count)'
          ls -la target/ex-direct-dxc 2>&1 | head -10 || true
