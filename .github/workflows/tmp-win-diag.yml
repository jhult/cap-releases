name: tmp-win-diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CapSoftware/Cap
          ref: cap-v0.6.3
          path: cap

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download zip
        shell: pwsh
        working-directory: cap
        run: |
          New-Item -ItemType Directory -Force -Path target | Out-Null
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.zip" -OutFile "target/ffmpeg-7.1.zip"
          Get-Item target/ffmpeg-7.1.zip | Select-Object Name, Length

      - name: Expand-Archive with Windows PowerShell 5.1
        shell: powershell
        working-directory: cap
        continue-on-error: true
        run: |
          Expand-Archive -Path "target/ffmpeg-7.1.zip" -DestinationPath "target" -Force
          Write-Host "exit=$LASTEXITCODE"
          Get-ChildItem target | Select-Object Name

      - name: Expand-Archive with pwsh 7
        shell: pwsh
        working-directory: cap
        continue-on-error: true
        run: |
          Expand-Archive -Path "target/ffmpeg-7.1.zip" -DestinationPath "target" -Force
          Get-ChildItem target | Select-Object Name

      - name: 7z extract
        shell: pwsh
        working-directory: cap
        continue-on-error: true
        run: |
          7z x -y "target/ffmpeg-7.1.zip" -otarget | Select-Object -Last 5
          Get-ChildItem target | Select-Object Name

      - name: Run setup.js directly
        shell: pwsh
        working-directory: cap
        continue-on-error: true
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/setup.js
